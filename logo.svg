<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#A100FF" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEA00" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <style>
      .gauge-track { stroke-dasharray: 200; stroke-dashoffset: 200; animation: drawIn 2s cubic-bezier(0.4,0,0.2,1) forwards; }
      #track-cyan { animation-delay: 0.2s; } #track-magenta { animation-delay: 0.4s; } #track-yellow { animation-delay: 0.6s; }
      #gauge-group { transform-origin: 140px 150px; animation: spinWheel 25s linear infinite; }
      #yield-arrow { transform-origin: 140px 150px; animation: arrowFloat 3s ease-in-out infinite; }
      .brand-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes drawIn { to { stroke-dashoffset: 0; } }
      @keyframes spinWheel { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
      @keyframes arrowFloat { 0%,100% { transform: translate(0,0) scale(1);} 50% { transform: translate(3px,-4px) scale(1.03);} }
    </style>
  </defs>
  <g id="optiyield-logo-assets">
    <g id="gauge-group">
      <path id="track-cyan" class="gauge-track" d="M 121.18,97.91 A 55,55 0 0,1 182.13,114.64" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" />
      <path id="track-magenta" class="gauge-track" d="M 112.5,202.33 A 55,55 0 0,1 191.68,131.18" fill="none" stroke="url(#magentaGrad)" stroke-width="14" stroke-linecap="round" />
      <path id="track-yellow" class="gauge-track" d="M 195,150 A 55,55 0 0,1 129.58,203.95" fill="none" stroke="url(#yellowGrad)" stroke-width="14" stroke-linecap="round" />
    </g>
    <path id="yield-arrow" d="M 125,170 L 162,132 M 162,132 L 145,132 M 162,132 L 162,149 M 118,155 L 134,139" fill="none" stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="140" cy="150" r="5" fill="#1E293B" opacity="0.8" />
    <g id="logo-typography" transform="translate(260, 0)">
      <text x="0" y="152" class="brand-text" font-size="64" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5px">Opti<tspan fill="url(#greenGrad)">Yield</tspan></text>
      <text x="4" y="190" class="brand-text" font-size="13" font-weight="700" fill="#64748B" letter-spacing="7px">FLEET PRINT COVERAGE</text>
    </g>
  </g>
</svg>
